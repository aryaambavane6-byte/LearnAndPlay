<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Animal Match - Learn & Play</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
    <link rel="manifest" href="manifest.json">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <h1>
            🌈 Learn & Play
        </h1>

    </header>


    <!-- GAME -->

    <main class="game-page">

        <h2>
            🐾 Animal Match
        </h2>


        <p class="question-number">

            Question
            <span id="questionNumber">
                1
            </span>
            of 5

        </p>


        <!-- ANIMAL IMAGE -->

        <div class="question-card">

            <img
                id="animalImage"
                src=""
                alt="Animal"
            >


            <h3>
                Which animal is this?
            </h3>

        </div>


        <!-- ANSWERS -->

        <div
            class="animal-answers"
            id="animalAnswers"
        >
        </div>


        <!-- FEEDBACK -->

        <p id="animalFeedback">
        </p>

    </main>


    <script>


        /* =========================
           ANIMAL QUESTIONS
        ========================= */


        const animals = [

            {
                image: "assets/images/Animal/cat.jpg",
                answer: "Cat"
            },

            {
                image: "assets/images/Animal/dog.jpg",
                answer: "Dog"
            },

            {
                image: "assets/images/Animal/elephant.jpg",
                answer: "Elephant"
            },

            {
                image: "assets/images/Animal/lion.jpg",
                answer: "Lion"
            },

            {
                image: "assets/images/Animal/rabbit.jpg",
                answer: "Rabbit"
            }

        ];


        /* =========================
           GAME VARIABLES
        ========================= */


        let currentQuestion = 0;

        let score = 0;


        /* =========================
           SHUFFLE QUESTIONS
        ========================= */


        function shuffleQuestions() {

            animals.sort(
                () =>
                    Math.random() - 0.5
            );

        }


        /* =========================
           GET RANDOM OPTIONS
        ========================= */


        function getOptions(correctAnswer) {

            let options = [
                correctAnswer
            ];


            let otherAnimals =
                animals
                    .map(
                        animal =>
                            animal.answer
                    )
                    .filter(
                        name =>
                            name !== correctAnswer
                    );


            otherAnimals.sort(
                () =>
                    Math.random() - 0.5
            );


            options.push(
                ...otherAnimals.slice(0, 3)
            );


            return options;

        }


        /* =========================
           LOAD QUESTION
        ========================= */


        function loadQuestion() {

            const question =
                animals[currentQuestion];


            /* Show image */

            document.getElementById(
                "animalImage"
            ).src =
                question.image;


            /* Question number */

            document.getElementById(
                "questionNumber"
            ).textContent =
                currentQuestion + 1;


            /* Clear feedback */

            document.getElementById(
                "animalFeedback"
            ).textContent = "";


            /* Create answer buttons */

            const answerContainer =
                document.getElementById(
                    "animalAnswers"
                );


            answerContainer.innerHTML = "";


            let options =
                getOptions(
                    question.answer
                );


            /* Shuffle answer choices */

            options.sort(
                () =>
                    Math.random() - 0.5
            );


            options.forEach(
                function(option) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.textContent =
                        option;


                    button.onclick =
                        function() {

                            checkAnswer(
                                option
                            );

                        };


                    answerContainer.appendChild(
                        button
                    );

                }
            );

        }


        /* =========================
           CHECK ANSWER
        ========================= */


        function checkAnswer(
            selectedAnswer
        ) {

            const correctAnswer =
                animals[
                    currentQuestion
                ].answer;


            const feedback =
                document.getElementById(
                    "animalFeedback"
                );


            if (
                selectedAnswer ===
                correctAnswer
            ) {

                score++;


                feedback.textContent =
                    "🎉 Correct! Great job!";


                feedback.className =
                    "correct";

            }

            else {

                feedback.textContent =
                    "❌ Not quite! The correct answer is "
                    + correctAnswer;


                feedback.className =
                    "wrong";

            }


            /* Disable buttons */

            const buttons =
                document.querySelectorAll(
                    "#animalAnswers button"
                );


            buttons.forEach(
                button => {

                    button.disabled =
                        true;

                }
            );


            /* Next question */

            setTimeout(
                nextQuestion,
                1200
            );

        }


        /* =========================
           NEXT QUESTION
        ========================= */


        function nextQuestion() {

            currentQuestion++;


            if (
                currentQuestion >=
                animals.length
            ) {

                showResult();

                return;

            }


            loadQuestion();

        }


        /* =========================
           FINAL RESULT
        ========================= */


        function showResult() {

            document.querySelector(
                ".game-page"
            ).innerHTML = `

                <div class="result-card">

                    <h2>
                        🎉 Amazing!
                    </h2>


                    <p class="final-score">

                        You scored
                        ${score}
                        /
                        ${animals.length}

                    </p>


                    <p>
                        🐾 Keep learning
                        about animals!
                    </p>


                    <a
                        href="animals.html"
                        class="play-again"
                    >
                        🔄 Play Again
                    </a>


                    <br><br>


                    <a
                        href="games.html"
                        class="back-button"
                    >
                        🎮 Choose Another Game
                    </a>

                </div>

            `;

        }


        /* =========================
           START GAME
        ========================= */


        shuffleQuestions();

        loadQuestion();


    </script>


    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker.register(
                        "service-worker.js"
                    );

                }
            );

        }

    </script>


</body>

</html>
