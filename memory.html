<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memory Match - Learn & Play</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
    <link rel="manifest" href="manifest.json">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <h1>
            🌈 Learn & Play
        </h1>

    </header>


    <!-- GAME -->

    <main class="memory-page">


        <h2>
            🧠 Memory Match
        </h2>


        <p>
            Find the matching animal pairs!
        </p>


        <p class="memory-score">

            Matches:
            <span id="matchCount">
                0
            </span>
            / 4

        </p>


        <!-- MEMORY CARDS -->

        <div
            class="memory-board"
            id="memoryBoard"
        >
        </div>


        <!-- MESSAGE -->

        <p
            id="memoryMessage"
            class="memory-message"
        >
        </p>


        <!-- BUTTONS -->

        <div class="memory-buttons">

            <button
                onclick="restartGame()"
            >
                🔄 Play Again
            </button>


            <a
                href="games.html"
                class="back-button"
            >
                🎮 Choose Another Game
            </a>

        </div>


    </main>


    <script>


        /* =========================
           ANIMAL PAIRS
        ========================= */


        const animals = [

            {
                name: "Cat",
                image: "assets/images/Animal/cat.jpg"
            },

            {
                name: "Dog",
                image: "assets/images/Animal/dog.jpg"
            },

            {
                name: "Elephant",
                image: "assets/images/Animal/elephant.jpg"
            },

            {
                name: "Lion",
                image: "assets/images/Animal/lion.jpg"
            }

        ];


        let cards = [];

        let firstCard = null;

        let secondCard = null;

        let lockBoard = false;

        let matches = 0;


        /* =========================
           SHUFFLE
        ========================= */


        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );


                [
                    array[i],
                    array[j]
                ] =
                [
                    array[j],
                    array[i]
                ];

            }

        }


        /* =========================
           CREATE CARDS
        ========================= */


        function createCards() {


            cards = [];


            animals.forEach(
                function(animal) {


                    cards.push({

                        name: animal.name,

                        image: animal.image

                    });


                    cards.push({

                        name: animal.name,

                        image: animal.image

                    });


                }
            );


            shuffle(cards);


            const board =
                document.getElementById(
                    "memoryBoard"
                );


            board.innerHTML = "";


            cards.forEach(
                function(card, index) {


                    const cardElement =
                        document.createElement(
                            "div"
                        );


                    cardElement.className =
                        "memory-card";


                    cardElement.dataset.index =
                        index;


                    cardElement.innerHTML = `

                        <div
                            class="card-inner"
                        >

                            <div
                                class="card-front"
                            >
                                ?
                            </div>


                            <div
                                class="card-back"
                            >

                                <img
                                    src="${card.image}"
                                    alt="${card.name}"
                                >

                            </div>

                        </div>

                    `;


                    cardElement.onclick =
                        function() {

                            flipCard(
                                cardElement
                            );

                        };


                    board.appendChild(
                        cardElement
                    );

                }
            );

        }


        /* =========================
           FLIP CARD
        ========================= */


        function flipCard(cardElement) {


            if (
                lockBoard
                ||
                cardElement === firstCard
                ||
                cardElement.classList.contains(
                    "matched"
                )
            ) {

                return;

            }


            cardElement.classList.add(
                "flipped"
            );


            if (!firstCard) {

                firstCard =
                    cardElement;

                return;

            }


            secondCard =
                cardElement;


            checkMatch();

        }


        /* =========================
           CHECK MATCH
        ========================= */


        function checkMatch() {


            const firstIndex =
                firstCard.dataset.index;


            const secondIndex =
                secondCard.dataset.index;


            const firstAnimal =
                cards[firstIndex].name;


            const secondAnimal =
                cards[secondIndex].name;


            if (
                firstAnimal ===
                secondAnimal
            ) {


                /* MATCH */

                firstCard.classList.add(
                    "matched"
                );


                secondCard.classList.add(
                    "matched"
                );


                matches++;


                document.getElementById(
                    "matchCount"
                ).textContent =
                    matches;


                document.getElementById(
                    "memoryMessage"
                ).textContent =
                    "🎉 Great! You found a match!";


                resetCards();


                if (matches === 4) {

                    setTimeout(
                        gameComplete,
                        500
                    );

                }

            }

            else {


                /* NOT A MATCH */

                lockBoard = true;


                document.getElementById(
                    "memoryMessage"
                ).textContent =
                    "❌ Not a match! Try again!";


                setTimeout(
                    function() {

                        firstCard.classList.remove(
                            "flipped"
                        );


                        secondCard.classList.remove(
                            "flipped"
                        );


                        resetCards();

                    },
                    1000
                );

            }

        }


        /* =========================
           RESET CARDS
        ========================= */


        function resetCards() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }


        /* =========================
           GAME COMPLETE
        ========================= */


        function gameComplete() {


            document.querySelector(
                ".memory-page"
            ).innerHTML = `

                <div
                    class="result-card"
                >

                    <h2>
                        🎉 Amazing!
                    </h2>


                    <p
                        class="final-score"
                    >

                        You found all
                        4 pairs! 🧠

                    </p>


                    <p>
                        ⭐ Excellent memory!
                    </p>


                    <button
                        onclick="restartGame()"
                    >
                        🔄 Play Again
                    </button>


                    <br><br>


                    <a
                        href="games.html"
                        class="back-button"
                    >
                        🎮 Choose Another Game
                    </a>

                </div>

            `;

        }


        /* =========================
           RESTART GAME
        ========================= */


        function restartGame() {

            location.reload();

        }


        /* =========================
           START GAME
        ========================= */


        createCards();


    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("service-worker.js");
            });
        }
    </script>

</body>

</html>
